<meta charset="utf-8">
<!--
  GAME JAM SIMULATOR
  Survive a 7-day game jam: open asset packs, wire gears (mechanics)
  to the CORE, apply art styles, beat the countdown, and pick an
  energy drink each night. Uses uploaded pixel art from /assets when
  present, with procedural fallbacks so it always runs.
-->
<div id="app">

  <!-- ===== Top HUD (dev-software status bar) ===== -->
  <header id="hud" class="hidden">
    <div class="hud-item"><span class="hud-label">DAY</span><span id="hud-day" class="hud-val">1/7</span></div>
    <div class="hud-item"><span class="hud-label">GOAL</span><span id="hud-goal" class="hud-val">18</span></div>
    <div class="hud-item clock" id="hud-clock-wrap">
      <span class="hud-label">⏳</span><span id="hud-clock" class="hud-val big">1:20</span>
    </div>
    <div class="hud-item energy"><span class="hud-label">⚡</span>
      <div class="bar"><div id="bar-energy" class="bar-fill energy-fill"></div></div>
      <span id="hud-energy" class="hud-val">26</span>
    </div>
    <div class="hud-item hype"><span class="hud-label">🔥 HYPE</span><span id="hud-hype" class="hud-val big">0</span></div>
    <button id="btn-mute" class="mini-btn" title="Mute / unmute sound">🔊</button>
  </header>

  <!-- ===== Main stage ===== -->
  <main id="stage">
    <img id="roombg" class="hidden" alt="">
    <canvas id="game" width="640" height="360"></canvas>
    <div id="tooltip" class="hidden"></div>
    <div id="statusbar" class="hidden"></div>
    <div id="tutorial" class="hidden"></div>
  </main>

  <!-- ===== Bottom tray: asset browser (your hand) + RUN ===== -->
  <footer id="tray" class="hidden">
    <div class="tray-head">📦 ASSET BROWSER</div>
    <div id="hand" class="hand"></div>
    <div id="actions">
      <div id="scoreline" class="scoreline"><span id="chips-out">0</span> <span class="times">×</span> <span id="mult-out">1</span></div>
      <button id="btn-run" class="big-btn">▶ RUN</button>
    </div>
  </footer>

  <!-- ===== Modal overlay ===== -->
  <div id="overlay" class="overlay"></div>

  <!-- ===== Loading screen ===== -->
  <div id="loading" class="overlay show">
    <div class="modal">
      <h1>🎮 GAME JAM<br>SIMULATOR</h1>
      <p class="lead" id="load-msg">Loading assets…</p>
      <div class="bar big"><div id="load-bar" class="bar-fill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="css/style.css">
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/assets.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
